# No container_name here: the e2e stack (tests/config/docker-compose-plugin.yaml)
# declares the same fixed names, and duplicated container names make `npm run server`
# fail outright while that stack is up. Without them Docker Compose derives unique
# names from the project, and only the (inherent) host-port overlap remains.
services:
  grafana:
    build:
      context: ./.config
      args:
        grafana_version: ${GRAFANA_VERSION:-12.1.1}
    ports:
      - 3000:3000/tcp
    volumes:
      - ./dist:/var/lib/grafana/plugins/clevercloud-warp10-datasource
      - ./provisioning:/etc/grafana/provisioning
    # The provisioned datasource targets host.docker.internal:8080; on Linux this
    # mapping only exists with the host-gateway alias below.
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      warp10:
        condition: service_healthy
    environment:
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=clevercloud-warp10-datasource
      - WARP10_URL=http://warp10:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3000/login | grep -q 'Grafana'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  warp10:
    image: warp10io/warp10:${WARP10_VERSION:-3.5.0-alpine}
    ports:
      - 8080:8080
      - 8081:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "-XPOST", "-d", "'RETURN 1'", "http://localhost:8080/api/v0/exec"]
      interval: 10s
      timeout: 5s
      retries: 6
