name: Bundle Stats

# Pull requests compare their bundle against the `main-branch-stats` artifact.
# Only a run on main produces that artifact, and GitHub expires it after 90 days,
# so main must run this workflow too or every PR fails with "Artifact has expired".
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# pull-requests: write is what the size comment needs; actions: read fetches the
# main-branch-stats artifact of the last main build. No content is ever written.
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    # GitHub strips write permissions from pull requests opened from forks, so the
    # comment step would fail with a 403 and paint an external contribution red for
    # a cosmetic metric. Skip the job there; the size comparison stays for internal
    # PRs, and the main/dispatch runs that produce the baseline artifact are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The action sets up Node, installs and builds by itself (with --profile
      # --json, the build that produces the stats), so no separate steps here.
      # Node 22 is what ci.yml and .nvmrc pin.
      - uses: grafana/plugin-actions/bundle-size@main
        with:
          node-version: '22'
