name: Bundle Stats

# Pull requests compare their bundle against the `main-branch-stats` artifact.
# Only a run on main produces that artifact, and GitHub expires it after 90 days,
# so main must run this workflow too or every PR fails with "Artifact has expired".
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - uses: grafana/plugin-actions/bundle-size@main
